# This is a Declarative Automation Bundle definition for WK1234_FR01_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: WK1234_FR01_Bundle
  uuid: 8edbf92d-5c56-4a71-9f00-cdb3c2320b43

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-64cfe5a8-8ca8.cloud.databricks.com
    variables:
      catalog: dev_cicd_demo
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-64cfe5a8-8ca8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dilipmgopinath@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dilipmgopinath@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_cicd_demo
      schema: prod
    permissions:
      - user_name: dilipmgopinath@gmail.com
        level: CAN_MANAGE
