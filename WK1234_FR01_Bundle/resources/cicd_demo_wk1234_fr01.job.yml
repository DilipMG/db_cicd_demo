# A sample job for WK1234_FR01_Bundle.

resources:
  jobs:
    sample_job:
      name: cicd_demo_wk1234_fr01

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

        pause_status: PAUSED
        #email_notifications:
        #  on_failure:
        #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/customer_360.ipynb

            source: WORKSPACE
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      git_source:
        git_branch: dev
        git_provider: gitHub
        git_url: https://github.com/DilipMG/db_cicd_demo.git
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - dilipmg711@gmail.com
        on_success:
          - dilipmg711@gmail.com
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
